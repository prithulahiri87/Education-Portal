name: harbor-crm

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in crm/.env}
      POSTGRES_DB: ${POSTGRES_DB:-crm}
    volumes:
      - harbor_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - harbor
    security_opt:
      - no-new-privileges:true

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-crm}
      CRM_API_TOKEN: ${CRM_API_TOKEN:-}
      CORS_ORIGINS: http://127.0.0.1:8088
      SEED_ON_START: "1"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - harbor
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8088:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - harbor
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  harbor_pg:

networks:
  harbor:
    driver: bridge

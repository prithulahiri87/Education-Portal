<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student IT Office Lab</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      padding: 20px;
      box-sizing: border-box;
    }
    h2 { margin-top: 0; }
    #office-editor {
      width: 100%;
      height: 750px;
      background: #fff;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <h2>Class 9 - Digital Documentation</h2>

  <div id="office-editor"></div>

  <script src="https://office.example.com/web-apps/apps/api/documents/api.js"></script>

  <script>
    const config = {
      documentType: "word",
      type: "desktop",

      document: {
        fileType: "docx",
        key: "UNIQUE_FILE_VERSION_KEY",
        title: "Student-Practice.docx",
        url: "https://portal.example.com/api/files/practice.docx",
        permissions: {
          edit: true,
          download: true
        }
      },

      editorConfig: {
        mode: "edit",
        callbackUrl:
          "https://portal.example.com/api/office/save",
        user: {
          id: "AUTHENTICATED_STUDENT_ID",
          name: "Student"
        }
      }
    };

    if (window.DocsAPI) {
      new DocsAPI.DocEditor("office-editor", config);
    }
  </script>
</body>
</html>

<header class="fig-header">
  <div>
    <h1>{{ page_title }}</h1>
    {% if page_lead %}<p class="fig-lead">{{ page_lead }}</p>{% endif %}
  </div>
  <div class="fig-planets" aria-hidden="true">
    <svg width="120" height="48" viewBox="0 0 120 48" fill="none"><circle cx="18" cy="28" r="12" fill="#C7D2FE"/><circle cx="46" cy="20" r="8" fill="#93C5FD"/><circle cx="78" cy="26" r="14" fill="#A5B4FC"/><path d="M96 34l8-16 8 16" fill="#FDBA74"/><circle cx="104" cy="14" r="3" fill="#F97316"/></svg>
  </div>
  <div class="fig-tools">
    <button class="fig-bell" type="button" aria-label="Notifications">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2.2a3.2 3.2 0 0 0-3.2 3.2v1.4c0 .5-.2 1-.5 1.4L3.2 9.6h9.6L11.7 8.2c-.3-.4-.5-.9-.5-1.4V5.4A3.2 3.2 0 0 0 8 2.2Z" stroke="#475569" stroke-width="1.3"/><path d="M6.6 11.2a1.4 1.4 0 0 0 2.8 0" stroke="#475569" stroke-width="1.3" stroke-linecap="round"/></svg>
    </button>
    <span class="fig-avatar" aria-hidden="true">PL</span>
  </div>
</header>
